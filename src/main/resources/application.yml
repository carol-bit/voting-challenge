spring:
  application:
    name: voting-api

  datasource:
    url: jdbc:postgresql://localhost:5432/voting
    username: voting
    password: voting
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379
      # password: yourpassword  # Uncomment if password is set

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: NON_NULL

server:
  port: 8080

logging:
  level:
    root: INFO
    org.springframework: INFO
    com.dbserver.votingchallenge: INFO
    org.hibernate.SQL: OFF
    org.hibernate.type.descriptor.sql.BasicBinder: OFF

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: always

# App custom properties
app:
  redis:
    enabled: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

scheduler:
  topic-auto-close:
    fixed-rate: 60000 # Time in milliseconds (e.g., 60000 = 60 seconds)

cpf:
  validation:
    url: http://localhost:8089
