spring:
  application:
    name: voting-api

  datasource:
    url: jdbc:postgresql://localhost:5432/voting
    username: voting
    password: voting
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration


  data:
    redis:
      host: localhost
      port: 6379
      # password: yourpassword  # se tiver senha, descomente
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080

logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    com.example.voting: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: always

# App custom properties
app:
  redis:
    enabled: true

