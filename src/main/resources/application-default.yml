spring:
  application:
    name: voting-api

  datasource:
    url: jdbc:postgresql://localhost:5432/voting
    username: voting
    password: voting
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: redis
      port: 6379
      timeout: 6000ms
    cache:
      type: redis


      # password: yourpassword  # se tiver senha, descomente
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: NON_NULL

server:
  port: 8080

logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    com.example.voting: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: always

# App custom properties
app:
  redis:
    enabled: true


springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

scheduler:
  topic-auto-close:
    fixed-rate: 60000  # tempo em milissegundos, ex: 60000 = 60 segundos

cpf:
  validation:
    url: http://localhost:8089
